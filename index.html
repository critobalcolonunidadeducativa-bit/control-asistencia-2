<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia Docente - U.E. Cristóbal Colón</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Izquierda -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl flex-shrink-0 z-30">
            <div>
                <div class="p-6 border-b border-slate-800">
                    <h1 class="text-white font-bold text-lg tracking-wide">U.E. CRISTÓBAL COLÓN</h1>
                    <p class="text-xs text-slate-400 mt-1">Control Asistencia 2026</p>
                </div>
                <nav class="p-4 space-y-1">
                    <button type="button" onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium transition shadow-sm text-left cursor-pointer">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard / Panel
                    </button>
                    <button type="button" onclick="switchTab('resumen')" id="nav-resumen" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left cursor-pointer">
                        <i class="fa-solid fa-users-rectangle w-5"></i> Nómina y Resumen
                    </button>
                    <button type="button" onclick="switchTab('atrasos-manuales')" id="nav-atrasos-manuales" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left text-amber-400 font-semibold cursor-pointer">
                        <i class="fa-solid fa-clock-rotate-left w-5"></i> Atrasos Manuales
                    </button>
                    <button type="button" onclick="switchTab('minutos-atraso')" id="nav-minutos-atraso" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left text-purple-400 font-semibold cursor-pointer">
                        <i class="fa-solid fa-hourglass-half w-5"></i> Minutos de Atraso & Permisos
                    </button>
                    <button type="button" onclick="switchTab('salidas')" id="nav-salidas" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left cursor-pointer">
                        <i class="fa-solid fa-calendar-xmark w-5"></i> Salidas y Permisos
                    </button>
                    <button type="button" onclick="switchTab('individual')" id="nav-individual" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left cursor-pointer">
                        <i class="fa-solid fa-user-pen w-5"></i> Ficha & Reporte Ind.
                    </button>
                    <button type="button" onclick="switchTab('biometrico')" id="nav-biometrico" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 hover:text-white transition text-left cursor-pointer">
                        <i class="fa-solid fa-folder-open w-5"></i> Archivos Biométricos
                    </button>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 space-y-1">
                <p>Inspectoría General v22.0</p>
                <p class="text-emerald-400 font-semibold"><i class="fa-solid fa-sparkles mr-1"></i> Mini Gemini Conectado</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto relative">
            <!-- Header con Filtro Global -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex flex-col xl:flex-row justify-between items-center gap-4 shadow-sm sticky top-0 z-20">
                <div class="flex items-center gap-4">
                    <h2 id="header-title" class="text-xl font-bold text-slate-800">Dashboard General de Asistencia</h2>
                    <span id="activeDateBadge" class="text-xs bg-blue-50 text-blue-700 font-semibold px-3 py-1 rounded-full border border-blue-200">Periodo Activo</span>
                </div>

                <div class="flex flex-wrap items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200">
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-semibold text-slate-500">Desde:</span>
                        <input type="date" id="filterDateFrom" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-medium text-slate-700">
                    </div>

                    <div class="flex items-center gap-1">
                        <span class="text-xs font-semibold text-slate-500">Hasta:</span>
                        <input type="date" id="filterDateTo" class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-medium text-slate-700">
                    </div>

                    <button type="button" onclick="applyDateFilter()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text
